# Reviewed HIGH/CRITICAL vulnerabilities for grafana/alloy:v1.21.3-distroless.
#
# The image-scan CI job is blocking: it fails on any HIGH/CRITICAL finding
# in this image that is not listed here. Entries are scoped by package PURL,
# so bumping a dependency or base image brings the finding back for review
# instead of silently inheriting the exception.
#
# Rules:
# - Do not add entries to make a PR green. Fix the finding or bump the tag.
# - Regenerate this file when the pinned tag changes and keep it accurate.
# - When expired_at passes, Trivy reports the finding again and the job
#   fails, forcing a re-review.
#
# The distroless variant carries the same Alloy binary and go-jose v4.1.6 as
# the default v1.21.3 image (which cleared CVE-2026-116587), but it has no
# package manager or shell. That removes the apt package from the image and
# with it CVE-2026-109518, which the default variant still carried on
# 2026-11-05.
#
# The tag is the first Alloy release vendoring github.com/go-jose/go-jose/v4
# v4.1.6. This file had no exceptions until 2026-11-09, when a Trivy
# database update reported CVE-2026-78661 (HIGH) in the golang.org/x/net
# v0.61.0 vendored by the Alloy binary. The fixed module is v0.62.0 and no
# published Alloy image ships it yet. The exception is scoped to that PURL
# and expires on 2026-11-30; remove it as soon as a fixed image is available.
vulnerabilities:
  - id: CVE-2026-78661
    purls:
      - "pkg:golang/golang.org/x/net@v0.61.0"
    statement: "Accepted for grafana/alloy:v1.21.3-distroless on 2026-11-09; no published Alloy image has the fixed golang.org/x/net v0.62.0 yet. Re-review and remove when a fixed image ships."
    expired_at: 2026-11-30
