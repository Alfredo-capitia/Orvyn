name: Bug Report
description: Report a bug
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version/Commit
      placeholder: "v0.0.1-dev or commit SHA"
  - type: textarea
    id: logs
    attributes:
      label: Logs (sanitized)
      description: Please redact secrets
